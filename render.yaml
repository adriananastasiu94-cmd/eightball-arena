services:
  - type: web
    name: eightball-arena-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run deploy:start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eightball-arena-db
          property: connectionString

databases:
  - name: eightball-arena-db
    plan: free
    databaseName: eightball_arena
    user: arena_user
