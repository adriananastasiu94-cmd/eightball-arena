services:
  - type: web
    name: eightball-arena-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run deploy:start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
